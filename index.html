<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0ea5e9" />
		<title>べんりツールズ</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="container">
			<header>
				<div class="logo" aria-hidden="true"></div>
				<div>
					<h1>べんりツールズ</h1>
					<p class="desc">日常で使える便利ツール集</p>
				</div>
			</header>

			<div class="card quick-card">
				<p class="eyebrow">クイック</p>
				<h2 class="section-title">すぐ作る</h2>
				<p class="section-copy">今日から2ヶ月先</p>
				<div class="btns hero-actions quick-actions" style="margin-top: 16px;">
					<button id="quickLaunchAllDayBtn">金曜19時~/土日終日</button>
					<button id="quickLaunchSplitBtn">金曜19時~/土日9~13時/土日13時~17時</button>
				</div>
				<div class="btns quick-subactions">
					<button id="openRakutenUnsubscribeBtn" class="secondary">楽天メルマガを全部解約</button>
				</div>
				<p class="muted quick-subnote">楽天のメルマガと楽天ショップのメルマガをまとめて止める公式ページを開きます。</p>
				<p class="muted quick-note">開いた先の「出欠表をつくる」を押すとリンクが完成します。</p>
			</div>

			<div class="card rm-card">
				<p class="eyebrow rm-eyebrow">筋トレ</p>
				<h2 class="section-title">RM換算表</h2>
				<p class="section-copy">1RMを入力すると各レップ数の推定重量を表示します。</p>

				<div class="rm-input-row">
					<label for="rmWeightInput">1RM (kg)</label>
					<input type="number" id="rmWeightInput" placeholder="例: 100" min="0" step="0.5" />
				</div>

				<div class="rm-table-wrapper" id="rmTableWrapper">
					<table class="rm-table" id="rmTable">
						<thead>
							<tr>
								<th>レップ数</th>
								<th>推定重量 (kg)</th>
								<th>%1RM</th>
								<th>強度</th>
							</tr>
						</thead>
						<tbody id="rmTableBody">
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div id="toast" class="toast" role="status" aria-live="polite">コピーしました</div>
		<script src="script.js" defer></script>
	</body>
</html>
