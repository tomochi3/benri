<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0ea5e9" />
	<title>べんりツールズ</title>
	<link rel="stylesheet" href="styles.css" />
</head>

<body>
	<div class="container">
		<header>
			<div class="logo" aria-hidden="true"></div>
			<div>
				<h1>べんりツールズ</h1>
				<p class="desc">日常で使える便利ツール集</p>
			</div>
		</header>

		<div class="card rm-card">
			<h2 class="section-title">RM換算表</h2>

			<div class="rm-tabs" id="rmTabs">
				<button class="rm-tab is-active" data-tab="bench" id="rmTabBench">🏋️ ベンチプレス</button>
				<button class="rm-tab" data-tab="squat" id="rmTabSquat">🦵 スクワット / デッド</button>
			</div>

			<div class="rm-formula" id="rmFormula">
				<span class="rm-formula-label">計算式:</span>
				<span class="rm-formula-expr" id="rmFormulaExpr">最大挙上重量 ＝ 重量 × 回数 ÷ 40 ＋ 重量</span>
			</div>

			<div class="rm-controls">
				<div class="rm-range-group">
					<label for="rmRangeMin">重量範囲 (kg)</label>
					<div class="rm-range-inputs">
						<input type="number" id="rmRangeMin" value="50" min="0" step="2.5" />
						<span class="rm-range-sep">〜</span>
						<input type="number" id="rmRangeMax" value="100" min="0" step="2.5" />
					</div>
				</div>
			</div>

			<div class="rm-table-wrapper" id="rmTableWrapper">
				<table class="rm-table" id="rmTable">
					<thead id="rmTableHead"></thead>
					<tbody id="rmTableBody"></tbody>
				</table>
			</div>
		</div>

		<div class="card quick-card">
			<p class="eyebrow">クイック</p>
			<h2 class="section-title">すぐ作る</h2>
			<p class="section-copy">今日から2ヶ月先</p>
			<div class="btns hero-actions quick-actions" style="margin-top: 16px;">
				<button id="quickLaunchAllDayBtn">金曜19時~/土日終日</button>
				<button id="quickLaunchSplitBtn">金曜19時~/土日9~13時/土日13時~17時</button>
			</div>
			<div class="btns quick-subactions">
				<button id="openRakutenUnsubscribeBtn" class="secondary">楽天メルマガを全部解約</button>
			</div>
			<p class="muted quick-subnote">楽天のメルマガと楽天ショップのメルマガをまとめて止める公式ページを開きます。</p>
			<p class="muted quick-note">開いた先の「出欠表をつくる」を押すとリンクが完成します。</p>
		</div>
	</div>

	<div id="toast" class="toast" role="status" aria-live="polite">コピーしました</div>
	<script src="script.js" defer></script>
</body>

</html>
